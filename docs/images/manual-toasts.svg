<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.0//EN" "http://www.w3.org/TR/2001/REC-SVG-20010904/DTD/svg10.dtd">
<svg width="865.00" height="369.00" xmlns="http://www.w3.org/2000/svg"><title>Four manual-review toasts: the reasoning reviewer escalated, unavailable, out of review time, and the no hand-off case.</title>
<rect width="865.00" height="369.00" fill="#0a0a0a" rx="8.00" ry="8.00" x="0.00px" y="0.00px"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.00px" fill="#c4c4c4" clip-path="url(#terminalMask)">
<text x="20.00px" y="36.80px" xml:space="preserve"><tspan xml:space="preserve" fill="#606060"># toast, resolution reasoning-escalated · OpenCode draws the frame</tspan><tspan xml:space="preserve"/></text><text x="20.00px" y="53.60px" xml:space="preserve"><tspan xml:space="preserve" fill="#f5a742">Manual review required</tspan><tspan xml:space="preserve" fill="#606060"> (warning)</tspan><tspan xml:space="preserve"/></text><text x="20.00px" y="70.40px" xml:space="preserve"><tspan xml:space="preserve" fill="#eeeeee">gpt-6-luna reviewed this after Jev; it needs your approval: The force-push would rewrite a shared</tspan><tspan xml:space="preserve"/></text><text x="20.00px" y="87.20px" xml:space="preserve"><tspan xml:space="preserve" fill="#eeeeee">branch.</tspan><tspan xml:space="preserve"/></text><text x="20.00px" y="104.00px" xml:space="preserve"/><text x="20.00px" y="120.80px" xml:space="preserve"><tspan xml:space="preserve" fill="#606060"># toast, resolution reasoning-unavailable · OpenCode draws the frame</tspan><tspan xml:space="preserve"/></text><text x="20.00px" y="137.60px" xml:space="preserve"><tspan xml:space="preserve" fill="#e06c75">Reasoning reviewer unavailable</tspan><tspan xml:space="preserve" fill="#606060"> (error)</tspan><tspan xml:space="preserve"/></text><text x="20.00px" y="154.40px" xml:space="preserve"><tspan xml:space="preserve" fill="#eeeeee">gpt-6-luna failed (timeout). This permission needs your approval. reasoning reviewer failed</tspan><tspan xml:space="preserve"/></text><text x="20.00px" y="171.20px" xml:space="preserve"><tspan xml:space="preserve" fill="#eeeeee">(TimeoutError): No answer within 120s</tspan><tspan xml:space="preserve"/></text><text x="20.00px" y="188.00px" xml:space="preserve"/><text x="20.00px" y="204.80px" xml:space="preserve"><tspan xml:space="preserve" fill="#606060"># toast, resolution budget-exhausted, as the V1 host shows it · OpenCode draws the frame</tspan><tspan xml:space="preserve"/></text><text x="20.00px" y="221.60px" xml:space="preserve"><tspan xml:space="preserve" fill="#f5a742">Manual review required</tspan><tspan xml:space="preserve" fill="#606060"> (warning)</tspan><tspan xml:space="preserve"/></text><text x="20.00px" y="238.40px" xml:space="preserve"><tspan xml:space="preserve" fill="#eeeeee">No review time left for gpt-6-luna after Jev (Jev escalated). 9s of the review budget remain and a</tspan><tspan xml:space="preserve"/></text><text x="20.00px" y="255.20px" xml:space="preserve"><tspan xml:space="preserve" fill="#eeeeee">hand-off needs 15s. The force-push would rewrite a shared branch.</tspan><tspan xml:space="preserve"/></text><text x="20.00px" y="272.00px" xml:space="preserve"/><text x="20.00px" y="288.80px" xml:space="preserve"><tspan xml:space="preserve" fill="#606060"># toast, resolution reviewer (no hand-off) · OpenCode draws the frame</tspan><tspan xml:space="preserve"/></text><text x="20.00px" y="305.60px" xml:space="preserve"><tspan xml:space="preserve" fill="#f5a742">Manual review required</tspan><tspan xml:space="preserve" fill="#606060"> (warning)</tspan><tspan xml:space="preserve"/></text><text x="20.00px" y="322.40px" xml:space="preserve"><tspan xml:space="preserve" fill="#eeeeee">Jev could not tell whether the user wanted a force-push.</tspan><tspan xml:space="preserve"/></text>
</g>
</svg>
