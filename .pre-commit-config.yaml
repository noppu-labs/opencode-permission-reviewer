# Install once per clone: uv sync && uv run pre-commit install
# Run everything by hand:  uv run pre-commit run --all-files
# Tool settings live in pyproject.toml, biome.jsonc, fta.json, knip.jsonc, .yamllint.yaml,
# .markdownlint-cli2.jsonc and .gitleaks.toml; this file only wires them to the commit.
minimum_pre_commit_version: "4.4.0"
repos:
  # File hygiene. detect-private-key is left out: gitleaks below covers secrets.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
        # Run through an interpreter (bun, node, python) or compiled by tsup, never executed in place.
        exclude: ^(benchmarks/permission-reviewer/(cli\.mjs|scripts/build-dataset\.py|tests/plugin-parity\.mjs)|src/cli/explain\.ts)$
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: mixed-line-ending

  # Secrets in the staged diff; settings in .gitleaks.toml. `gitleaks-tree` (manual stage) scans
  # the working tree for CI, where the staged diff is empty; it reads .gitleaks.toml from the
  # directory it scans.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
      - id: gitleaks
        alias: gitleaks-tree
        name: gitleaks (whole tree)
        entry: gitleaks dir --redact --verbose
        pass_filenames: false
        stages: [manual]

  # YAML style beyond check-yaml's syntax check. Rules in .yamllint.yaml.
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  # Settings in .markdownlint-cli2.jsonc.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2

  # Settings in [tool.codespell] in pyproject.toml; codespell needs tomli to read them before Python 3.11.
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies: ["tomli; python_version < '3.11'"]

  # Python. Settings in pyproject.toml.
  # Keep rev in step with ruff in uv.lock, so the hook and `uv run ruff` agree.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
        exclude: ^tests/live-fixture/
      - id: ruff-format
        exclude: ^tests/live-fixture/
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]
        additional_dependencies: ["bandit[toml]"]
        exclude: ^tests/live-fixture/
  - repo: https://github.com/rohaquinlop/complexipy-pre-commit
    rev: v8.0.1
    hooks:
      - id: complexipy
        exclude: ^tests/live-fixture/
  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.16
    hooks:
      - id: vulture
        exclude: ^tests/live-fixture/
  # pyrefly and pylint run from the uv.lock pins rather than a second pre-commit rev.
  - repo: local
    hooks:
      - id: pyrefly
        name: pyrefly
        entry: uv run --frozen pyrefly check
        language: unsupported
        types: [python]
        pass_filenames: false
        exclude: ^tests/live-fixture/
      - id: pylint
        name: pylint (module length only, limit in [tool.pylint.format])
        entry: uv run --frozen pylint
        language: unsupported
        types: [python]
        exclude: ^(tests/live-fixture/|benchmarks/permission-reviewer/scripts/build-dataset\.py$|tests/compatibility/test_v2_reviewer\.py$)
      # Pending (quality/3-python): the two modules over 600 lines, capped at their current length.
      - id: pylint-ceiling-build-dataset
        name: pylint (build-dataset.py, at most 3060 lines)
        entry: uv run --frozen pylint --max-module-lines=3060
        language: unsupported
        files: ^benchmarks/permission-reviewer/scripts/build-dataset\.py$
      - id: pylint-ceiling-v2-reviewer
        name: pylint (test_v2_reviewer.py, at most 676 lines)
        entry: uv run --frozen pylint --max-module-lines=676
        language: unsupported
        files: ^tests/compatibility/test_v2_reviewer\.py$

  # TypeScript and JavaScript, from the bun.lock pins through `bun run`, never `bunx` (see
  # docs/DEVELOPMENT.md, "Where the pins live"). Settings and pending exemptions in biome.jsonc.
  - repo: local
    hooks:
      - id: biome
        name: biome check
        entry: bun run --bun biome check --write --error-on-warnings --no-errors-on-unmatched --files-ignore-unknown=true
        language: unsupported
        # A regex, not types: identify gives .jsonc files no json tag.
        files: \.([cm]?[jt]sx?|jsonc?)$
      # The live harness imports ../dist, so the hook skips it; CI's check job type-checks it
      # after a build.
      - id: tsc
        name: tsc --noEmit
        entry: bun run --bun tsc --noEmit -p tsconfig.hook.json
        language: unsupported
        files: \.[cm]?tsx?$|^(tsconfig(\.hook)?\.json|package\.json|bun\.lock)$
        pass_filenames: false
      # Fails when any scanned file scores above score_cap in fta.json.
      - id: fta
        name: fta (maintainability, cap in fta.json)
        entry: bun run fta
        language: unsupported
        # A regex so a commit that only edits fta.json still runs it.
        files: \.([cm]?[jt]sx?)$|^fta\.json$
        pass_filenames: false
      # knip also reads package.json, so any JSON change reruns it.
      - id: knip
        name: knip (dead code and dependencies, config in knip.jsonc)
        entry: bun run knip
        language: unsupported
        # A regex, not types: identify gives .jsonc files no json tag.
        files: \.([cm]?[jt]sx?|jsonc?)$
        pass_filenames: false
      # Fails on any advisory except the three the package.json "audit" script ignores.
      # See docs/DEVELOPMENT.md, "Ignored audit advisories".
      - id: bun-audit
        name: bun audit (bun.lock; ignored advisories in package.json "audit")
        entry: bun run audit
        language: unsupported
        files: ^(bun\.lock|package\.json)$
        pass_filenames: false
