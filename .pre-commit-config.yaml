# Install once per clone: uv sync && uv run pre-commit install
# Run everything by hand:  uv run pre-commit run --all-files
# Tool settings live in pyproject.toml, .yamllint.yaml, .markdownlint-cli2.jsonc and .gitleaks.toml;
# this file only wires them to the commit.
minimum_pre_commit_version: "4.4.0"
repos:
  # File hygiene. detect-private-key is left out: gitleaks below covers secrets.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
        # Run through an interpreter (bun, node, python) or compiled by tsup, never executed in place.
        exclude: ^(benchmarks/permission-reviewer/(cli\.mjs|scripts/build-dataset\.py|tests/plugin-parity\.mjs)|src/cli/explain\.ts)$
      - id: end-of-file-fixer
        # complexipy rewrites its snapshot without a final newline on every run.
        exclude: ^complexipy-snapshot\.json$
      - id: trailing-whitespace
      - id: mixed-line-ending

  # Secrets in the staged diff. Test fixtures use synthetic credentials (CONTRIBUTING), so a hit
  # outside them is what this should catch. Settings in .gitleaks.toml.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # YAML style beyond check-yaml's syntax check. Rules in .yamllint.yaml.
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  # Settings in .markdownlint-cli2.jsonc.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2

  # Settings in [tool.codespell] in pyproject.toml. pre-commit's codespell hook needs the toml
  # extra to read them.
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies: ["tomli; python_version < '3.11'"]

  # Python. Settings in pyproject.toml. tests/live-fixture holds deliberate attack fixtures the
  # live harness runs, so no Python hook sees it.
  # Keep rev in step with ruff in uv.lock, so the hook and `uv run ruff` agree.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
        exclude: ^tests/live-fixture/
      - id: ruff-format
        exclude: ^tests/live-fixture/
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]
        additional_dependencies: ["bandit[toml]"]
        exclude: ^tests/live-fixture/
  - repo: https://github.com/rohaquinlop/complexipy-pre-commit
    rev: v8.0.1
    hooks:
      - id: complexipy
        exclude: ^tests/live-fixture/
  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.16
    hooks:
      - id: vulture
        exclude: ^tests/live-fixture/
  # pyrefly and pylint run from the uv.lock pins rather than a second pre-commit rev.
  - repo: local
    hooks:
      - id: pyrefly
        name: pyrefly
        entry: uv run --frozen pyrefly check
        language: unsupported
        types: [python]
        pass_filenames: false
        exclude: ^tests/live-fixture/
      - id: pylint
        name: pylint (module length only, limit in [tool.pylint.format])
        entry: uv run --frozen pylint
        language: unsupported
        types: [python]
        exclude: ^tests/live-fixture/

  # TypeScript and JavaScript. Biome runs from the bun.lock pin, so the hook and `bun run lint`
  # agree. Settings, and the pending exemptions each stacked PR deletes, in biome.jsonc.
  # `bun run` only resolves node_modules/.bin, so without `bun install` the hook fails instead of
  # fetching the unrelated npm package named `biome` the way `bunx` would.
  - repo: local
    hooks:
      - id: biome
        name: biome check
        entry: bun run --bun biome check --write --error-on-warnings --no-errors-on-unmatched --files-ignore-unknown=true
        language: unsupported
        # A regex, not types: identify gives .jsonc files no json tag.
        files: \.([cm]?[jt]sx?|jsonc?)$
      - id: tsc
        name: tsc --noEmit
        entry: bun run typecheck
        language: unsupported
        types_or: [ts, tsx]
        pass_filenames: false
      # score_cap and the pending per-file exclusions are in fta.json. Exits non-zero when any
      # scanned file scores above the cap. `bun run` resolves node_modules/.bin only, so it
      # cannot fetch an unrelated package the way `bunx` would.
      - id: fta
        name: fta (maintainability, cap in fta.json)
        entry: bun run fta
        language: unsupported
        # A regex so a commit that only edits fta.json still runs it.
        files: \.([cm]?[jt]sx?)$|^fta\.json$
        pass_filenames: false
      # Entry points, the pending exemptions each stacked PR deletes, and the reasons are in
      # knip.jsonc. It also reads package.json, so any JSON change reruns it.
      - id: knip
        name: knip (dead code and dependencies, config in knip.jsonc)
        entry: bun run knip
        language: unsupported
        # A regex, not types: identify gives .jsonc files no json tag.
        files: \.([cm]?[jt]sx?|jsonc?)$
        pass_filenames: false
      # Fails on any advisory except the three ignored in the package.json "audit" script
      # (seroval via solid-js, http-cache-semantics via @opencode/plugin). Runs only when the
      # lockfile or the script changes; a periodic `pre-commit run --all-files` catches new advisories.
      - id: bun-audit
        name: bun audit (bun.lock; ignored advisories in package.json "audit")
        entry: bun run audit
        language: unsupported
        files: ^(bun\.lock|package\.json)$
        pass_filenames: false
