# yamllint (run by pre-commit with --strict, so warnings fail too).
extends: default

ignore: |
  .venv/
  node_modules/
  dist/
  coverage/

rules:
  # No YAML file here opens with `---`.
  document-start: disable
  # Issue-template text, URLs and pinned action SHAs don't wrap.
  line-length:
    max: 160
  # Accept `- item` at the key's indent or one level in, but stay consistent within a file.
  indentation:
    spaces: 2
    indent-sequences: consistent
  # Only `true`/`false` are booleans. Quote yes/no/on/off, which YAML 1.1 parsers read as booleans.
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false
  comments:
    min-spaces-from-content: 1
