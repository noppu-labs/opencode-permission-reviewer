name: openrouter decision models

on:
  workflow_dispatch:
  schedule:
    - cron: "53 8 * * 1"

permissions: {}

concurrency: openrouter-models

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Credentials are not persisted: `bun install` and the update script run without a token on
      # disk. The push step passes the token explicitly.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: develop
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Refresh the decision model list
        id: update
        run: bun scripts/openrouter-decision-models.ts
      - name: Commit and push the update branch
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C chore/openrouter-models
          git add -A
          git commit -m "chore(openrouter): update decision models"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" chore/openrouter-models
      - name: Open or update the pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state=$(gh pr view chore/openrouter-models --json state -q .state || true)
          if [ "$state" = "OPEN" ]; then
            gh pr edit chore/openrouter-models --body-file "$RUNNER_TEMP/openrouter-models-pr.md"
          else
            gh pr create --base develop --head chore/openrouter-models \
              --title "chore(openrouter): update decision models" \
              --body-file "$RUNNER_TEMP/openrouter-models-pr.md"
          fi
