name: release

# Three entry points. A push to `main` that changes package.json checks the
# merge commit (`quality`, `build`), then `tag` creates `v<version>` and
# dispatches this workflow at it; nothing is published in that run. A pushed
# `v*` tag builds and publishes the package with provenance, then creates
# checksums, an SBOM, and a GitHub Release. Manual dispatch retries an
# existing tag without moving it; always dispatch at the tag so provenance
# records it:
#   gh workflow run release.yml --ref vX.Y.Z -f tag=vX.Y.Z
#
# The workflow is split so the job that installs dependencies and builds
# never holds write permissions: `build` only reads (and uploads the artifact
# plus its checksum), `publish` downloads the artifact, re-verifies its
# SHA-256 against the checksums produced next to the build, and only then
# publishes and creates the release.
#
# Prerequisites (configure once in repo settings):
#   - An npm trusted publisher for the package: GitHub Actions, this
#     repository, workflow `release.yml`, no environment, npm publish
#     allowed. The publish job authenticates through OIDC, so no npm token
#     is stored in the repository.
#   - Actions → General → "Workflow permissions" allows id-token writes
#     (required for OIDC publishing and npm --provenance).
#
# Administrative prerequisites (outside this repository, see "Releasing" in
# docs/DEVELOPMENT.md for the commands):
#   - `main` is protected: a pull request with a required review and the
#     required `ci` check.
#   - A tag ruleset on `refs/tags/v*` restricts creation, update, and
#     deletion, with repository admins and the GitHub Actions app
#     (integration 15368) as bypass actors. Without the app, the `tag` job
#     cannot create the tag.
# A tag-triggered workflow can never be its own root of trust: whoever can
# merge to `main` or push a `v*` tag controls these guards, so the
# protection must live outside the repo.
#
# Prereleases use next; legacy maintenance uses v1 without moving latest.

on:
  push:
    branches: [main]
    tags:
      - "v*"
    # Applies to the branch push only; GitHub does not evaluate paths for tag pushes.
    paths:
      - package.json
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to retry
        required: true
        type: string

permissions: {}

jobs:
  # On a push to main: is package.json's version untagged? Reads through the API, so no
  # repository code runs here.
  pending:
    name: pending version
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      due: ${{ steps.check.outputs.due }}
    steps:
      - name: Find an untagged package.json version
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(gh api "repos/$GITHUB_REPOSITORY/contents/package.json?ref=$GITHUB_SHA" --jq .content | base64 -d | jq -r .version)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::package.json version '$version' is not semver"
            exit 1
          fi
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>/dev/null; then
            echo "$tag already exists; nothing to release."
            echo "due=false" >> "$GITHUB_OUTPUT"
          else
            echo "due=true" >> "$GITHUB_OUTPUT"
          fi

  # Every pre-commit hook on every file plus the gitleaks-tree scan, as in the CI quality job.
  # Hook repos install mutable tags and unpinned transitive dependencies, so they run here, apart
  # from `build`, with a read-only token.
  quality:
    name: quality
    needs: pending
    # Tag push and dispatch skip `pending`; a push to main runs only when a release is due.
    if: ${{ !cancelled() && (needs.pending.result == 'skipped' || needs.pending.outputs.due == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history for the tag ancestry check.
          fetch-depth: 0
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || needs.pending.outputs.tag && github.sha || github.ref }}
          persist-credentials: false

      # The same tag check as `build`, run here because this job executes dependency and hook code first.
      - name: Verify tag (pre-install gate)
        if: ${{ !needs.pending.outputs.tag }}
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse "refs/tags/$RELEASE_TAG^{}")" = "$(git rev-parse HEAD)" ]
          git merge-base --is-ancestor HEAD origin/main
          pkg_version=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' package.json | head -1)
          if [ "$RELEASE_TAG" != "v$pkg_version" ]; then
            echo "Tag $RELEASE_TAG is not v + package.json version $pkg_version"
            exit 1
          fi

      # Push to main: the tag does not exist yet, so check the commit and version instead.
      - name: Verify untagged main commit (pre-install gate)
        if: ${{ needs.pending.outputs.tag }}
        env:
          RELEASE_TAG: ${{ needs.pending.outputs.tag }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          git merge-base --is-ancestor HEAD origin/main
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "$RELEASE_TAG already exists"
            exit 1
          fi
          pkg_version=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' package.json | head -1)
          if [ "$RELEASE_TAG" != "v$pkg_version" ]; then
            echo "Tag $RELEASE_TAG is not v + package.json version $pkg_version"
            exit 1
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      # No cache: nothing a pull request could have written is restored into a release run.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - run: bun install --frozen-lockfile --ignore-scripts

      - run: uv sync --locked --no-build

      - run: uv run --frozen --no-build pre-commit run --all-files --show-diff-on-failure

      - run: uv run --frozen --no-build pre-commit run --hook-stage manual gitleaks-tree --all-files

  build:
    needs: [pending, quality]
    if: ${{ !cancelled() && needs.quality.result == 'success' }}
    name: build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      dist_tag: ${{ steps.meta.outputs.dist_tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history for tag ancestry checks and release notes.
          fetch-depth: 0
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || needs.pending.outputs.tag && github.sha || github.ref }}
          persist-credentials: false

      # Guard against mistags BEFORE any toolchain or dependency code runs:
      # the tag must point at HEAD, HEAD must descend from origin/main, and
      # the tag version must equal package.json's. Pure git + shell (no bun,
      # no node) so an invalid tag fails without executing anything from the
      # dependency tree.
      - name: Verify tag (pre-install gate)
        if: ${{ !needs.pending.outputs.tag }}
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse "refs/tags/$RELEASE_TAG^{}")" = "$(git rev-parse HEAD)" ]
          git merge-base --is-ancestor HEAD origin/main
          pkg_version=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' package.json | head -1)
          if [ "$RELEASE_TAG" != "v$pkg_version" ]; then
            echo "Tag $RELEASE_TAG is not v + package.json version $pkg_version"
            exit 1
          fi

      # Push to main: the tag does not exist yet, so check the commit and version instead.
      - name: Verify untagged main commit (pre-install gate)
        if: ${{ needs.pending.outputs.tag }}
        env:
          RELEASE_TAG: ${{ needs.pending.outputs.tag }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          git merge-base --is-ancestor HEAD origin/main
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "$RELEASE_TAG already exists"
            exit 1
          fi
          pkg_version=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' package.json | head -1)
          if [ "$RELEASE_TAG" != "v$pkg_version" ]; then
            echo "Tag $RELEASE_TAG is not v + package.json version $pkg_version"
            exit 1
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile

      - name: Read tag metadata
        id: meta
        env:
          RELEASE_TAG: ${{ inputs.tag || needs.pending.outputs.tag || github.ref_name }}
        run: GITHUB_REF_NAME="$RELEASE_TAG" bun scripts/release-metadata.ts

      # This job holds the artifact, so it runs only what bun.lock pins; the pre-commit hooks run in `quality`.
      - name: Build and test
        run: |
          bun run build
          bun run typecheck
          bun test

      # Pack into a tarball and verify the ship set.
      - name: Pack
        run: |
          mkdir -p artifacts
          npm pack --ignore-scripts --pack-destination artifacts
          set -- artifacts/*.tgz
          [ "$#" -eq 1 ] && [ -f "$1" ]
          REVIEWER_TEST_TARBALL="$PWD/$1" bun run test:package
          echo "##[group]Tarball contents"
          tar -tzf artifacts/*.tgz | sort
          echo "##[endgroup]"

      - name: Generate SHA-256 checksums
        run: |
          cd artifacts
          sha256sum *.tgz > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-artifact
          path: artifacts/
          if-no-files-found: error

  # Tags the pre-checked commit and starts the publishing run at the tag, so provenance records
  # refs/tags/v<version>. A GITHUB_TOKEN dispatch starts a run; a GITHUB_TOKEN tag push would not.
  tag:
    name: tag and dispatch release
    needs: [pending, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.pending.outputs.due == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - name: Create v<version> and dispatch release.yml at it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.pending.outputs.tag }}
        run: |
          set -euo pipefail
          repo="repos/$GITHUB_REPOSITORY"
          if gh api "$repo/git/ref/tags/$TAG" --silent 2>/dev/null; then
            tagged=$(gh api "$repo/commits/$TAG" --jq .sha)
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::$TAG already points at $tagged, not $GITHUB_SHA"
              exit 1
            fi
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "$TAG is already released."
              exit 0
            fi
            active=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --branch "$TAG" \
              --json status --jq '[.[] | select(.status != "completed")] | length')
            if [ "$active" != "0" ]; then
              echo "A release run for $TAG is already in progress."
              exit 0
            fi
          else
            object=$(gh api "$repo/git/tags" -f tag="$TAG" -f message="$TAG" \
              -f object="$GITHUB_SHA" -f type=commit --jq .sha)
            gh api "$repo/git/refs" -f ref="refs/tags/$TAG" -f sha="$object" --silent
          fi
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f tag="$TAG"
          echo "Dispatched release.yml at $TAG."

  publish:
    name: publish
    needs: build
    # The push to main only pre-checks; the run it dispatches at the tag publishes.
    if: ${{ !cancelled() && needs.build.result == 'success' && !(github.event_name == 'push' && github.ref_type == 'branch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # CHANGELOG notes and `gh release --target main` need the repo, but
          # no credentials are persisted after this step.
          fetch-depth: 0
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Re-verify tag still points at this commit
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse "refs/tags/$RELEASE_TAG^{}")" = "$(git rev-parse HEAD)" ]

      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifact
          path: artifacts

      # Integrity handoff: the artifact must still match the checksum
      # generated next to the build, byte for byte.
      - name: Verify artifact checksums
        working-directory: artifacts
        run: |
          set -euo pipefail
          sha256sum --check checksums-sha256.txt

      # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1; Node 24
      # bundles a new enough npm. npm exchanges the job's OIDC token itself.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Publish the exact verified artifact.
      - name: Publish to npm
        run: |
          set -- artifacts/*.tgz
          [ "$#" -eq 1 ]
          npm publish "./$1" \
            --provenance \
            --access public \
            --tag "${{ needs.build.outputs.dist_tag }}"

      # Generate a CycloneDX SBOM from the extracted tarball contents.
      - name: Extract tarball for SBOM
        run: |
          mkdir -p sbom-src
          tar -xzf artifacts/*.tgz -C sbom-src --strip-components=1
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: sbom-src
          format: cyclonedx-json
          output-file: artifacts/sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      # Create the GitHub Release with notes extracted from CHANGELOG.md.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Extract the matching section from CHANGELOG.md (falls back to
          # auto-generated notes if the section is not found).
          version="${{ needs.build.outputs.version }}"
          notes=$(awk -v v="$version" '
            /^## \[/ { in_section=0 }
            $0 ~ "^## \\[" v "\\]" { in_section=1; next }
            in_section { print }
          ' CHANGELOG.md)

          tag="${{ needs.build.outputs.tag }}"
          if [ "${{ needs.build.outputs.prerelease }}" = "true" ]; then
            gh release create "$tag" --title "$tag" --target main --prerelease --latest=false
          elif [ "${{ needs.build.outputs.dist_tag }}" = "v1" ]; then
            gh release create "$tag" --title "$tag" --target main --latest=false
          else
            gh release create "$tag" --title "$tag" --target main
          fi

          if [ -n "$notes" ]; then
            printf '%s\n' "$notes" | gh release edit "$tag" --notes-file -
          else
            gh release edit "$tag" --generate-notes
          fi

          gh release upload "$tag" \
            artifacts/*.tgz \
            artifacts/checksums-sha256.txt \
            artifacts/sbom.cdx.json \
            --clobber
