name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Hook repos install unpinned transitive dependencies, so this job gets a read-only token
    # that is not left in .git/config.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.5"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: uv sync --locked --no-build
      # The tsc hook imports dist/ (tests/live-host-regressions.ts), so build first.
      - run: bun run build
      # pre-commit builds an environment per hook repo; cache them keyed on the config.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # The gitleaks hook scans the staged diff, which is empty here. The gitleaks-tree hook
      # (manual stage) scans the whole working tree instead.
      # --all-files also runs the bun-audit hook, which at commit time fires only when the
      # lockfile changes, so a new advisory fails every push.
      - run: uv run --frozen --no-build pre-commit run --all-files --show-diff-on-failure
      - run: uv run --frozen --no-build pre-commit run --hook-stage manual gitleaks-tree --all-files

  check:
    name: check (bun ${{ matrix.bun }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported Bun (matches engines.bun >=1.3.0) and the pinned
        # current version. A drift in either direction surfaces before main.
        bun: ["1.3.0", "1.3.5"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run typecheck
      - run: bun test

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Coverage numbers are reported against the pinned current version.
          bun-version: "1.3.5"
      - run: bun install --frozen-lockfile
      - run: bun run test:coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error

  benchmark:
    name: benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.5"
      - run: bun install --frozen-lockfile
      - working-directory: benchmarks/permission-reviewer
        run: |
          node cli.mjs validate
          node --test tests/*.test.mjs
          bun tests/plugin-parity.mjs --repo ../..

  hosts:
    name: hosts (${{ matrix.host }}, ${{ matrix.package-manager }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        host: [v1, v2]
        package-manager: [npm, bun]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.5"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: bun install --frozen-lockfile
      - run: bun run build
      # pytest comes from uv.lock, the same pin the quality job installs. The matrix has run on
      # Python 3.13, so keep it rather than the runner's default.
      - run: uv sync --locked --no-build --python 3.13
      - name: Install pinned hosts in scratch directories
        env:
          HOST_GENERATION: ${{ matrix.host }}
        run: |
          bun tests/compatibility/install-hosts.ts
          if [ "$HOST_GENERATION" = v2 ]; then
            HOST_GENERATION=v1 bun tests/compatibility/install-hosts.ts
          fi
      - name: Install the packed plugin without lifecycle scripts
        env:
          PACKAGE_MANAGER: ${{ matrix.package-manager }}
        run: bun tests/compatibility/install-package.ts
      - name: Exercise real hosts with isolated config and synthetic models
        env:
          HOST_GENERATION: ${{ matrix.host }}
        run: |
          if [ "$HOST_GENERATION" = v1 ]; then
            uv run --frozen --no-build pytest \
              tests/compatibility/test_opencode_v1.py \
              tests/compatibility/test_evidence_recovery.py \
              tests/compatibility/test_local_evidence.py \
              -q
            uv run --frozen --no-build pytest tests/compatibility/test_tui.py -k v1 -q
          else
            uv run --frozen --no-build pytest \
              tests/compatibility/test_opencode_v2.py \
              tests/compatibility/test_v2_reviewer.py \
              tests/compatibility/test_v2_analysis_regressions.py \
              tests/compatibility/test_rollback.py \
              tests/compatibility/test_evidence_recovery.py \
              tests/compatibility/test_local_evidence.py \
              -q
            uv run --frozen --no-build pytest tests/compatibility/test_tui.py -k v2 -q
          fi

  # Stable required-check name for branch protection. Matrix leg names change
  # when Bun versions drift; this gate does not.
  ci:
    name: ci
    if: always()
    needs: [quality, check, coverage, hosts, benchmark]
    runs-on: ubuntu-latest
    steps:
      - name: All CI checks green
        run: |
          [ "${{ needs.quality.result }}" = "success" ] || { echo "quality failed: ${{ needs.quality.result }}"; exit 1; }
          [ "${{ needs.check.result }}" = "success" ] || { echo "check failed: ${{ needs.check.result }}"; exit 1; }
          [ "${{ needs.coverage.result }}" = "success" ] || { echo "coverage failed: ${{ needs.coverage.result }}"; exit 1; }
          [ "${{ needs.hosts.result }}" = "success" ] || { echo "hosts failed: ${{ needs.hosts.result }}"; exit 1; }
          [ "${{ needs.benchmark.result }}" = "success" ] || { echo "benchmark failed: ${{ needs.benchmark.result }}"; exit 1; }
