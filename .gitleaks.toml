# gitleaks (pre-commit hook). Default rules, plus the synthetic credentials the tests
# feed to the redactor on purpose.
[extend]
useDefault = true

[[allowlists]]
description = "Synthetic credentials shared by the tests, kept in one fixture file (CONTRIBUTING requires synthetic fixtures)"
targetRules = ["generic-api-key"]
# Both conditions must hold: only this file, and only these exact fixture values.
condition = "AND"
paths = ['''^tests/fixtures/synthetic-secrets\.ts$''']
regexes = ['''^(sksynthetic1234567890abcdef(1234567890)?)$''']

[[allowlists]]
description = "The parity check's git blob SHA-1 pin for src/shell-token.ts; generic-api-key fires because the key says \"token\""
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^benchmarks/permission-reviewer/lib/plugin\.mjs$''']
regexTarget = "line"
regexes = ['''^\s*"src/shell-token\.ts": "[0-9a-f]{40}",$''']
